<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tierra deportiva | Tu pasión, nuestro terreno</title>
    <link rel="stylesheet" href="./CSS/styles.css">

    <!-- Fuentes Oficiales (Montserrat, Raleway, Lato) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700;800&family=Raleway:wght@600&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!--Header-->
    <header class="container">
        <div class="row header-row">

        </div>
    </header>


    <!-- HERO -->

    <section id="inicio" class="hero py-5 text-center text-white">
        <div class="container py-4">

            <!-- 1. Íconos Circulares Neón por Disciplina -->
            <div class="d-flex justify-content-center align-items-center flex-wrap gap-4 mb-4">

                <!-- Fútbol -->
                <div class="icono-deporte text-center">
                    <a href="#futbol" class="text-decoration-none">
                        <div class="circulo-neon">
                            <i class="bi bi-dribbble"></i>
                        </div>
                        <span class="deportes font-sub">Fútbol</span>
                    </a>
                </div>

                <!-- Running -->
                <div class="icono-deporte text-center">
                    <a href="#running" class="text-decoration-none">
                        <div class="circulo-neon">
                            <i class="bi bi-person-walking"></i>
                        </div>
                        <span class="deportes font-sub">Running</span>
                    </a>
                </div>

                <!-- Natación -->
                <div class="icono-deporte text-center">
                    <a href="#natacion" class="text-decoration-none">
                        <div class="circulo-neon">
                            <i class="bi bi-tsunami"></i>
                        </div>
                        <span class="deportes font-sub">Natación</span>
                    </a>
                </div>

                <!-- Gimnasio -->
                <div class="icono-deporte text-center">
                    <a href="#gimnasio" class="text-decoration-none">
                        <div class="circulo-neon">
                            <i class="bi bi-activity"></i>
                        </div>
                        <span class="deportes font-sub">Gimnasio</span>
                    </a>
                </div>

            </div>

            <!-- 2. Título Principal y Eslogan -->
            <span class="badge bg-jade mb-3 px-3 py-2 text-uppercase font-sub">Tu pasión, nuestro terreno</span>
            <h1 class="display-3 font-head fw-bold text-uppercase mb-3">
                Contigo en todas tus facetas
            </h1>
            <p class="lead font-body mb-4 mx-auto text-white-50 fs-5" style="max-width: 650px;">
                Equipamiento técnico especializado y reserva de espacios deportivos en CDMX, Edomex y Monterrey.
            </p>

            <!-- 3. Botones de Acción (CTA) -->
            <div class="d-flex justify-content-center gap-3 flex-wrap">
                <a href="#newsletter" class="btn btn-rosa btn-lg rounded-pill px-4 py-3 font-head fw-bold">
                    Suscríbete
                </a>
                <a href="#contacto" class="btn btn-dorado btn-lg rounded-pill px-4 py-3 font-head fw-bold">
                    Contacto
                </a>
            </div>

        </div>
    </section>


    <!--PRODUCTOS POR DEPORTE-->
    <section class="container">
        <!-- futbol -->
        <div class="row">Futbol</div>
        <div class="row">
            <div class="col product card"></div>
            <div class="col product card"></div>
            <div class="col product card"></div>
            <div class="col product card"></div>
        </div>
    </section>

    <!--NEWSLETTER-->
    <section class="container">
        <div class="row newsletter-row">

        </div>
    </section>

    <!-- FOOTER-->
    <footer class="container">
        <div class="row footer-row">

        </div>
    </footer>

    <script src="./JS/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
